services:
  php:
    image: dunglas/frankenphp:latest-php8.2
    ports:
      - "9001:9001"
      - "443:443"
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      # Database config for Docker default - override in config/aggregate.yaml
      - DATABASE_URL=mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_VERSION:-8.0}
    depends_on:
      database:
        condition: service_healthy
      asset-compile:
        condition: service_completed_successfully

  asset-compile:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
    command: php bin/console asset-map:compile

  worker:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      # All analytics config should be in config/aggregate.yaml
      # These are Docker defaults only
      - DATABASE_URL=mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_VERSION:-8.0}
    command: php -d variables_order=EGPCS bin/console messenger:consume async -vv
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aggregate_analytics}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql:rw
  ###< doctrine/doctrine-bundle ###

volumes:
  database_data:
  caddy_data:
  caddy_config:
