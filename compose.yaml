# Development-only Docker Compose stack. See DEPLOYMENT.md for production deployment guidance.
services:
  php:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1-php8.2@sha256:ef1cd0757b85f3d713e67afb6d2b54b116becb7259a4bf6c6ae64862952d1ef6}
    ports:
      - "9002:9002"
      - "443:443"
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD or DOCKER_DATABASE_URL}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_SERVER_VERSION:-8.0.0}}
    depends_on:
      asset-compile:
        condition: service_completed_successfully

  asset-compile:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1-php8.2@sha256:ef1cd0757b85f3d713e67afb6d2b54b116becb7259a4bf6c6ae64862952d1ef6}
    volumes:
      - .:/app:delegated
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
    command: php bin/console asset-map:compile

  worker:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1-php8.2@sha256:ef1cd0757b85f3d713e67afb6d2b54b116becb7259a4bf6c6ae64862952d1ef6}
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD or DOCKER_DATABASE_URL}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_SERVER_VERSION:-8.0.0}}
    command: php -d variables_order=EGPCS bin/console messenger:consume async -vv
    restart: unless-stopped

  database-mysql:
    profiles: ["mysql"]
    image: mysql:${MYSQL_VERSION:-8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aggregate_analytics}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database_mysql_data:/var/lib/mysql:rw
      - ./docker/mysql/load-timezones.sh:/docker-entrypoint-initdb.d/load-timezones.sh:ro
    networks:
      default:
        aliases: ["database"]

  database-postgres:
    profiles: ["postgres"]
    image: postgres:${POSTGRES_VERSION:-16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aggregate_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-aggregate_analytics}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database_postgres_data:/var/lib/postgresql/data:rw
    networks:
      default:
        aliases: ["database"]

  database-mariadb:
    profiles: ["mariadb"]
    image: mariadb:${MARIADB_VERSION:-11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aggregate_analytics}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - database_mariadb_data:/var/lib/mysql:rw
      - ./docker/mysql/load-timezones.sh:/docker-entrypoint-initdb.d/load-timezones.sh:ro
    networks:
      default:
        aliases: ["database"]

volumes:
  database_mysql_data:
  database_postgres_data:
  database_mariadb_data:
  caddy_data:
  caddy_config:
