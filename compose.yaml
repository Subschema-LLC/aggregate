services:
  php:
    image: dunglas/frankenphp:latest-php8.2
    ports:
      - "9001:9001"
      - "443:443"
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      # Database config for Docker default - override in config/aggregate.yaml
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}
    depends_on:
      database:
        condition: service_healthy
      asset-compile:
        condition: service_completed_successfully

  asset-compile:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
    command: php bin/console asset-map:compile

  worker:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      # All analytics config should be in config/aggregate.yaml
      # These are Docker defaults only
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}
    command: php -d variables_order=EGPCS bin/console messenger:consume async -vv
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

volumes:
  database_data:
  caddy_data:
  caddy_config:
