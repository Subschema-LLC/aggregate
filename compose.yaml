services:
  php:
    image: dunglas/frankenphp:latest-php8.2
    ports:
      - "9001:9001"
      - "443:443"
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_VERSION:-8.0}}
    depends_on:
      asset-compile:
        condition: service_completed_successfully

  asset-compile:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
    command: php bin/console asset-map:compile

  worker:
    image: dunglas/frankenphp:latest-php8.2
    volumes:
      - .:/app:delegated
      - ./php/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini:ro
    working_dir: /app
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-aggregate_analytics}?serverVersion=${MYSQL_VERSION:-8.0}}
    command: php -d variables_order=EGPCS bin/console messenger:consume async -vv
    restart: unless-stopped

  database-mysql:
    profiles: ["mysql"]
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aggregate_analytics}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "3307:3306"
    volumes:
      - database_mysql_data:/var/lib/mysql:rw
    networks:
      default:
        aliases: ["database"]

  database-postgres:
    profiles: ["postgres"]
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aggregate_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-aggregate_analytics}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5433:5432"
    volumes:
      - database_postgres_data:/var/lib/postgresql/data:rw
    networks:
      default:
        aliases: ["database"]

  database-mariadb:
    profiles: ["mariadb"]
    image: mariadb:${MARIADB_VERSION:-11.4}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aggregate_analytics}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "3308:3306"
    volumes:
      - database_mariadb_data:/var/lib/mysql:rw
    networks:
      default:
        aliases: ["database"]

volumes:
  database_mysql_data:
  database_postgres_data:
  database_mariadb_data:
  caddy_data:
  caddy_config:
