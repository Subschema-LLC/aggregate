name: Build release package

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package, vYYYY.MM.NN (for example v2026.09.01)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_sqlite, pdo_mysql, mbstring, xml, curl, intl, sodium, zip
          coverage: none
          tools: composer:v2
      # No dependency cache: a signed release never restores an Actions cache
      # that another workflow run could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          echo "RELEASE_OUTPUT=$RUNNER_TEMP/aggregate-release" >> "$GITHUB_ENV"
          cp .env.prod.example .env
          composer validate --strict --no-check-publish --no-plugins --no-interaction
          composer install --no-interaction --prefer-dist --no-scripts
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install UI JavaScript test dependencies
        run: php bin/console importmap:install --env=test --no-debug --no-interaction
      - name: Audit locked build and runtime dependencies
        run: |
          composer audit --locked --no-plugins --no-interaction
          npm audit
      - name: Verify release tag and publishing branch
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # vYYYY.MM.NN: NN numbers that month's releases from 01; it is not the day.
          python3 scripts/release-version.py check "$RELEASE_TAG" > /dev/null
          branch="$(php scripts/release-branch.php)"
          commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$commit" = "$tagged_commit"
          git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch" || { echo "Release tag must belong to publishing branch $branch." >&2; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Test application and release tooling
        run: |
          php bin/phpunit
          npm run test:js
          python3 -m unittest discover -s tests/Release -p 'test_*.py' -v
      - name: Prepare production dependencies and browser assets
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-build-only-not-a-deployment-secret
        run: |
          # Fresh vendor directory prevents development packages surviving a build.
          rm -rf vendor src/DataFixtures
          composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader
          composer check-platform-reqs --no-dev --no-plugins
          php bin/console importmap:install
          php bin/console assets:install public
          php bin/console asset-map:compile
          npm run build:js
          npm run check:js
      - name: Build installable ZIP and manifest
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 scripts/build-release.py --output-dir "$RELEASE_OUTPUT" --version "$RELEASE_TAG" --branch "$RELEASE_BRANCH" --commit "$RELEASE_COMMIT"
      - name: Smoke test packaged application without Git or build tools
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-smoke-test-only-not-a-deployment-secret
          DATABASE_URL: 'mysql://build:build@127.0.0.1:3306/aggregate?serverVersion=8.0.0'
        shell: bash
        run: |
          package="$RELEASE_OUTPUT/aggregate-${RELEASE_TAG#v}.zip"
          smoke="$RUNNER_TEMP/aggregate-release-smoke"
          python3 -m zipfile -e "$package" "$smoke"
          cd "$smoke"
          php bin/console about
          php bin/console cache:clear
          php bin/console lint:container
          DASHBOARD_ENABLED=0 php bin/console cache:clear
          DASHBOARD_ENABLED=0 php bin/console lint:container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-package
          path: ${{ runner.temp }}/aggregate-release/*
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-release.php
            config/release-signing.pub
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: sodium
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-package
          path: release
      - name: Check release signing setup and sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          php scripts/sign-release.php --check-key config/release-signing.pub
          php scripts/sign-release.php release/aggregate-release.json config/release-signing.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-package
          path: release/*
          if-no-files-found: error
          retention-days: 7
      # The verify job checks the package against this same trusted key, so it
      # never has to check out the release commit itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-trusted-key
          path: config/release-signing.pub
          if-no-files-found: error
          retention-days: 7

  verify:
    # Runs the packaged application's own verifier against the trusted key the
    # sign job used. Code from the package runs here, with a read-only token, no
    # secrets and no checkout, never in the job that can write releases.
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-trusted-key
          path: trusted-key
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_sqlite, pdo_mysql, mbstring, xml, curl, intl, sodium, zip
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-package
          path: release
      - name: Verify signed package using the application verifier
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-verification-only-not-a-deployment-secret
          DATABASE_URL: 'mysql://build:build@127.0.0.1:3306/aggregate?serverVersion=8.0.0'
          RELEASE_BRANCH: ${{ needs.build.outputs.branch }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          package="$PWD/release/aggregate-${RELEASE_TAG#v}.zip"
          manifest="$PWD/release/aggregate-release.json"
          signature="$PWD/release/aggregate-release.json.sig"
          trusted_key="$PWD/trusted-key/release-signing.pub"
          verifier="$RUNNER_TEMP/aggregate-release-verify"
          python3 -m zipfile -e "$package" "$verifier"
          cp "$trusted_key" "$verifier/config/release-signing.pub"
          cd "$verifier"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $branch = App\Service\UpdateSettings::validateBranch(getenv('RELEASE_BRANCH'));
          $yaml = Symfony\Component\Yaml\Yaml::dump(['updates_branch' => $branch]);
          $handle = @fopen('config/aggregate_prod.yaml', 'xb');
          if ($handle === false || fwrite($handle, $yaml) !== strlen($yaml)) {
              throw new RuntimeException('Cannot create temporary verification configuration.');
          }
          fclose($handle);
          PHP
          php bin/console app:updates:verify-package "$package" "$manifest" "$signature"

  draft-release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-package
          path: release
      - name: Attach the package to the release, or create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/aggregate-*.zip release/aggregate-release.json release/aggregate-release.json.sig)
          # A maintainer may have created the release in GitHub's release form,
          # which also creates the tag that started this workflow. Attach the
          # package to that release: a second release with the same tag could
          # never be published.
          matches=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.assets | length) \(.draft)"')
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Aggregate $RELEASE_TAG" --generate-notes "${assets[@]}"
            echo "Created a draft release for $RELEASE_TAG with the package. Review and publish it." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$count" -eq 1 ]; then
            read -r id attached draft <<< "$matches"
            # Never replace assets on an existing release; tags and packages are immutable.
            if [ "$attached" -ne 0 ]; then
              echo "::error title=Release $RELEASE_TAG::The release already has $attached attached files. Packages are never replaced; tag a new version instead."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}"
            if [ "$draft" = "true" ]; then
              echo "Attached the package to the draft release $RELEASE_TAG (id $id). Review and publish it." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Attached the package to the published release $RELEASE_TAG (id $id); installations can update to it now." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error title=Release $RELEASE_TAG::$count releases use the tag $RELEASE_TAG. Delete the extra ones on GitHub (deleting a release keeps its tag), then run this workflow again for the tag."
            exit 1
          fi
