<VirtualHost *:80>
    ServerName analytics.example.com
    DocumentRoot /var/www/aggregate-sy/public

    <Directory /var/www/aggregate-sy/public>
        AllowOverride All
        Require all granted

        # Enable .htaccess
        Options -Indexes +FollowSymLinks
    </Directory>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/aggregate_error.log
    CustomLog ${APACHE_LOG_DIR}/aggregate_access.log combined

    # Environment variables (if not using .env)
    # SetEnv APP_ENV prod
</VirtualHost>

