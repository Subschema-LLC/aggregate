# This file is normally included from nginx's http context.
map $request_uri $aggregate_access_loggable {
    default 1;
    ~^/api/receive(?:\?|$) 0;
    ~^/aggregate\.js(?:\?|$) 0;
    ~^/internal-traffic(?:/|\?|$) 0;
}

server {
    listen 80;
    server_name analytics.example.com;
    root /var/www/aggregate-sy/public;

    client_max_body_size 64k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        # Try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    # Allow only the authenticated branding action to carry a 2 MiB logo plus
    # multipart overhead. Symfony still enforces authorization, CSRF, and image limits.
    location = /dashboard/settings/branding {
        client_max_body_size 3m;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # API endpoint - important for analytics
    location ~ ^/api/ {
        # Do not persist tracker IP/User-Agent/referrer metadata in access logs.
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # aggregate.js tracking script
    location = /aggregate.js {
        access_log off;
        # Runtime YAML settings are injected by ScriptController.
        rewrite ^ /index.php last;

        # ScriptController supplies cache headers. Classic script tags can
        # load this script across origins without CORS response headers.
    }

    # DEV
    # This rule should only be placed on your development environment
    # In production, don't include this and don't deploy index_dev.php or config/secrets/dev/
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # When you are using symlinks to link the document root to the
        # current version of your application, you should pass the real
        # application path instead of the path to the symlink to PHP
        # FPM.
        # Otherwise, PHP's OPcache may not properly detect changes to
        # your PHP files (see https://github.com/zendtech/ZendOptimizerPlus/issues/126
        # for more information).
        # Caveat: When PHP-FPM is hosted on a different machine from nginx
        #         $realpath_root may not resolve as you expect! In this case try using
        #         $document_root instead.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # Return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    error_log /var/log/nginx/aggregate_error.log;
    # The map uses the original request URI, so the tracker remains excluded
    # after nginx internally redirects it to index.php.
    access_log /var/log/nginx/aggregate_access.log combined if=$aggregate_access_loggable;
}
