<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">How an event flows through Aggregate</title>
  <desc id="desc">A browser sends an event to /api/receive, which checks it and records it anonymously, or through Messenger when the visitor consented, into the private events table. Maintenance archives and deletes old rows. Reporting views over events and archives apply completed buckets and minimum cell counts, and BI tools read only those views. YAML, .env.local, the optional dashboard and CLI commands configure every step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .key { fill: #fbf1f3; stroke: #a31e36; stroke-width: 1.5; }
      .private { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .title { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .text { font-size: 13px; fill: #424a53; }
      .label { font-size: 12px; fill: #57606a; font-style: italic; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .config { stroke: #a31e36; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1020" height="580" rx="14" fill="#f6f7f9"/>

  <!-- Browser -->
  <rect class="card" x="20" y="40" width="210" height="120" rx="10"/>
  <text class="title" x="36" y="66">Visitor's browser</text>
  <text class="text" x="36" y="90">Your website's page</text>
  <text class="text" x="36" y="110">Consent banner (optional)</text>
  <text class="text" x="36" y="130">Tracker: /aggregate.js</text>
  <text class="text" x="36" y="148">or the tag manager</text>

  <!-- Collection endpoint -->
  <rect class="key" x="290" y="20" width="270" height="180" rx="10"/>
  <text class="title" x="306" y="46">POST /api/receive</text>
  <text class="text" x="306" y="72">1. Kill switch and excluded paths</text>
  <text class="text" x="306" y="94">2. Rate limit (rotating HMAC bucket)</text>
  <text class="text" x="306" y="116">3. Website token and origin</text>
  <text class="text" x="306" y="138">4. Sanitize path, coarse dimensions</text>
  <text class="text" x="306" y="160">5. Allowed goals and properties</text>
  <text class="text" x="306" y="182">6. Consent decides the mode</text>

  <path class="line" d="M230,100 L286,100" marker-end="url(#arrow)"/>
  <text class="label" x="236" y="92">JSON</text>

  <!-- Anonymous -->
  <rect class="card" x="620" y="20" width="360" height="78" rx="10"/>
  <text class="title" x="636" y="46">Anonymous mode: recorded now</text>
  <text class="text" x="636" y="68">UTC hour bucket; no visitor or session ID,</text>
  <text class="text" x="636" y="86">IP address or User-Agent string</text>

  <!-- Enhanced -->
  <rect class="card" x="620" y="118" width="360" height="82" rx="10"/>
  <text class="title" x="636" y="144">Enhanced mode: through Messenger</text>
  <text class="text" x="636" y="166">Only after an affirmative choice: IDs,</text>
  <text class="text" x="636" y="184">properties, exact time (sync or worker)</text>

  <path class="line" d="M560,70 L616,60" marker-end="url(#arrow)"/>
  <path class="line" d="M560,150 L616,158" marker-end="url(#arrow)"/>
  <text class="label" x="566" y="58">no consent</text>
  <text class="label" x="566" y="176">consent</text>

  <!-- Events table -->
  <rect class="private" x="620" y="244" width="360" height="62" rx="10"/>
  <text class="title" x="636" y="270">events (private table)</text>
  <text class="text" x="636" y="292">Both modes in one table</text>
  <path class="line" d="M980,59 L1002,59 L1002,275 L984,275" marker-end="url(#arrow)"/>
  <path class="line" d="M980,159 L1002,159"/>

  <!-- Maintenance -->
  <rect class="card" x="290" y="244" width="270" height="62" rx="10"/>
  <text class="title" x="306" y="270">app:analytics:maintain</text>
  <text class="text" x="306" y="292">Archive old rows, apply retention</text>
  <path class="line" d="M620,290 L564,290" marker-end="url(#arrow)"/>

  <!-- Archive tables -->
  <rect class="private" x="290" y="350" width="270" height="62" rx="10"/>
  <text class="title" x="306" y="376">Archive tables (private)</text>
  <text class="text" x="306" y="398">Counted cells, no raw rows</text>
  <path class="line" d="M425,306 L425,346" marker-end="url(#arrow)"/>

  <!-- Reporting views -->
  <rect class="key" x="620" y="350" width="360" height="110" rx="10"/>
  <text class="title" x="636" y="376">Reporting views (the contract)</text>
  <text class="text" x="636" y="400">bi_anonymous_*: completed buckets,</text>
  <text class="text" x="636" y="418">minimum cell count, archive included</text>
  <text class="text" x="636" y="440">bi_dim_*, bi_glossary_*: labels for codes</text>
  <path class="line" d="M800,306 L800,346" marker-end="url(#arrow)"/>
  <path class="line" d="M560,381 L616,381" marker-end="url(#arrow)"/>

  <!-- BI tool -->
  <rect class="card" x="620" y="500" width="360" height="60" rx="10"/>
  <text class="title" x="636" y="526">Power BI, Tableau, Looker</text>
  <text class="text" x="636" y="547">View-only database grant</text>
  <path class="line" d="M800,460 L800,496" marker-end="url(#arrow)"/>

  <!-- Administration -->
  <rect class="card" x="20" y="350" width="210" height="210" rx="10"/>
  <text class="title" x="36" y="376">Administration</text>
  <text class="text" x="36" y="400">config/aggregate.yaml</text>
  <text class="text" x="36" y="420">.env.local (database, secret)</text>
  <text class="text" x="36" y="440">Dashboard (optional)</text>
  <text class="text" x="36" y="460">CLI commands</text>
  <text class="text" x="36" y="480">Setup page and /install</text>
  <text class="text" x="36" y="500">Signed updates</text>
  <text class="label" x="36" y="540">configures every step</text>
  <path class="config" d="M125,350 L125,222 L330,222 L330,204" marker-end="url(#arrow)"/>
  <path class="config" d="M125,275 L286,275" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect class="private" x="290" y="470" width="28" height="18" rx="4"/>
  <text class="text" x="326" y="484">Private: never grant to routine BI users</text>
  <rect class="key" x="290" y="500" width="28" height="18" rx="4"/>
  <text class="text" x="326" y="514">Where the privacy rules are enforced</text>
  <path class="config" d="M290,540 L318,540"/>
  <text class="text" x="326" y="544">Settings</text>
</svg>
