# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

imports:
    - { resource: navigation.yaml }
    - { resource: goals.yaml }
    - { resource: quick_search.yaml }
    # Untracked operator overrides. Each file replaces the matching shipped
    # parameter as a whole and is never changed by application updates.
    - { resource: navigation.local.yaml, ignore_errors: not_found }
    - { resource: goals.local.yaml, ignore_errors: not_found }
    - { resource: quick_search.local.yaml, ignore_errors: not_found }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Empty by default. Deployments behind a reverse proxy may set exact proxy
    # addresses/CIDRs through TRUSTED_PROXIES; never trust arbitrary clients.
    env(TRUSTED_PROXIES): ''
    env(AGGREGATE_GITHUB_TOKEN): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Controller/'
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Service/Update/FileTransaction.php'
            # Built by ApplicationUpdateService with its HTTP client, cache and token.
            - '../src/Service/Update/GitHubBranchStatus.php'
            # Served by config/setup.php before the kernel exists; never a service.
            - '../src/Setup/FirstRunSetup.php'
            - '../src/Setup/SetupPage.php'
            # BigQuery value objects and per-run clients, built by their factories.
            - '../src/Service/BigQuery/{BigQueryClient,BigQueryException,GoogleCloudCredentials,GoogleSignInCredentials,ServiceAccountCredentials,ServiceAccountKey,TokenCache}.php'
            - '../src/Service/ViewSync/{ViewSnapshot,ViewSyncDefinition,ViewSyncException}.php'
            # Value objects and static helpers of the processing tasks and audit trail.
            - '../src/Service/Operations/{TaskTrigger,AuditTrailFilter,AdminActions,ConfigurationChanges}.php'
            - '../src/Service/IngestionResult.php'
            # Built by WebsiteScopeCatalog with its parsed-YAML cache.
            - '../src/Service/WebsiteScopeFiles.php'
            # Built by the sync runner for the reporting database's connection.
            - '../src/Service/ReportingDatabase/{ReportingDatabaseException,ReportingTableWriter}.php'
            # Made for each forensic copy, holding that copy's hashing key; never shared.
            - '../src/Service/ForensicDatabase/ForensicPseudonyms.php'
            # Thrown when named zones cannot be compiled; not a service.
            - '../src/Service/MysqlTimeZoneTablesMissing.php'
            # Transfer value objects and package files, built by DataTransfer.
            - '../src/Service/DataTransfer/{DataTransferException,IdMap,TransferPackage,TransferReport}.php'
            # Reporting API value objects and problems.
            - '../src/Service/ReportingApi/{ApiProblem,ApiToken,ViewQuery,ViewScope,ViewGrant}.php'
            # MCP value objects, errors and static helpers.
            - '../src/Service/Mcp/{McpConnection,McpPrincipal,McpHttpError,McpToolError,McpProtocolError,McpViewGuide}.php'
            - '../src/Service/Mcp/OAuth/{OAuthError,OAuthClient,RedirectUri,AuthorizationRequest}.php'

    App\Controller\HomeController: ~
    App\Controller\ReceiveController:
        tags: ['controller.service_arguments']
    App\Controller\ScriptController:
        tags: ['controller.service_arguments']
    App\Controller\ConsentScriptController:
        tags: ['controller.service_arguments']
    App\Controller\StandaloneConsentScriptController:
        tags: ['controller.service_arguments']
    App\Controller\TagScriptController:
        tags: ['controller.service_arguments']
    App\Controller\HealthController:
        tags: ['controller.service_arguments']
    App\Controller\BrandingLogoController:
        tags: ['controller.service_arguments']
    App\Controller\BrandingThemeController:
        tags: ['controller.service_arguments']
    App\Controller\InternalTrafficPublicController:
        tags: ['controller.service_arguments']
    App\Controller\ReportingApiController:
        tags: ['controller.service_arguments']
    App\Controller\McpController:
        tags: ['controller.service_arguments']

    App\Service\ReportingApi\ApiTokenStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Mcp\OAuth\OAuthStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Email\EmailSecrets:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ParsedYamlCache:
        arguments:
            $directory: '%kernel.cache_dir%/parsed-yaml'

    App\Service\AggregateConfigLoader:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Service\WebsiteScopeCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Security\Access\PermissionGroupCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Service\AppBranding:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $mainNavigation: '%app.main_navigation%'

    App\Service\ApplicationUpdateService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $cache: '@cache.app'
            $githubToken: '%env(AGGREGATE_GITHUB_TOKEN)%'

    App\Service\InstalledRelease:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ReleaseUpdateService:
        arguments:
            $cache: '@cache.app'
            $githubToken: '%env(AGGREGATE_GITHUB_TOKEN)%'

    App\Service\ReleasePackageVerifier:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Update\:
        resource: '../src/Service/Update/'
        exclude:
            - '../src/Service/Update/FileTransaction.php'
            # Built by ApplicationUpdateService with its HTTP client, cache and token.
            - '../src/Service/Update/GitHubBranchStatus.php'
            - '../src/Service/Update/UpdatePaths.php'
        bind:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'

    # Keep this explicit: without the extension, Twig silently renders every
    # app_branding value as empty when strict variables are disabled in prod.
    App\Twig\NavigationExtension:
        arguments:
            $quickSearchSynonyms: '%app.quick_search_synonyms%'
            $quickSearchExtraItems: '%app.quick_search_extra_items%'
            $websiteManager: '@App\Service\WebsiteConfigManager'
            $activityService: '@App\Service\WebsiteActivityService'
            $conditions: '@App\Service\NavigationConditions'

    App\Twig\AppBrandingExtension:
        autoconfigure: false
        tags: ['twig.extension']

    App\Service\BrandingLogoManager:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Service\WebsiteConfigManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\SiteScriptConfig:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Service\BrowserScriptCompactor:
        arguments:
            $cacheDirectory: '%kernel.cache_dir%/browser-scripts'

    App\Service\TrackerScript:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\InternalTrafficMarking:
        arguments:
            $secret: '%kernel.secret%'

    App\Service\BigQuery\BigQuerySettings:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\BigQuery\BigQuerySecrets:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ViewSync\ViewExporter:
        arguments:
            $reader: '@App\Service\ViewSync\ViewReader'
            $projectDir: '%kernel.project_dir%'

    # The forensic database copies raw tables, with identifiers hashed per
    # copy, and private views; it exports through its own reader.
    app.forensic_database.exporter:
        class: App\Service\ViewSync\ViewExporter
        arguments:
            $reader: '@App\Service\ForensicDatabase\ForensicReader'
            $projectDir: '%kernel.project_dir%'

    App\Service\ForensicDatabase\ForensicDatabaseSyncRunner:
        arguments:
            $exporter: '@app.forensic_database.exporter'

    App\Service\Operations\BackgroundCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'

    App\Service\Scheduler\Scheduler:
        arguments:
            $maintenance: '@App\Service\Scheduler\AnalyticsMaintenanceJob'
            $bigQuery: '@App\Service\Scheduler\BigQuerySyncJob'
            $reportingDatabase: '@App\Service\Scheduler\ReportingDatabaseSyncJob'
            $forensicDatabase: '@App\Service\Scheduler\ForensicDatabaseSyncJob'
            $projectDir: '%kernel.project_dir%'

    App\Service\Scheduler\SchedulerSetup:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\LocalEnvironmentFile:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Service\ReportingDatabase\ReportingDatabaseConnection:
        arguments:
            # Infrastructure, like DATABASE_URL; it holds a password, so it is
            # never a YAML setting. See docs/REPORTING-DATABASE.md.
            $url: '%env(default::REPORTING_DATABASE_URL)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\ForensicDatabase\ForensicDatabaseConnection:
        arguments:
            # Like REPORTING_DATABASE_URL: infrastructure with a password,
            # never YAML. See docs/FORENSIC-DATABASE.md.
            $forensicUrl: '%env(default::FORENSIC_DATABASE_URL)%'
            $forensicProjectDir: '%kernel.project_dir%'

    App\Service\TagManagerSettings:
        arguments:
            # Remembers custom JavaScript that passed its checks; safe to clear.
            $codeCacheDirectory: '%kernel.cache_dir%/tag-manager-code'

    App\Service\GoalEventRegistry:
        arguments:
            $definitions: '%app.goal_events%'

    App\Service\Glossary\BiGlossarySettings:
        arguments:
            $goalDefinitions: '%app.goal_events%'

    App\Service\Glossary\BuiltinGlossaryCatalog:
        arguments:
            $translator: '@translator'

    App\Service\GeoIp\GeoIpResolverInterface:
        alias: App\Service\GeoIp\ConfiguredGeoIpResolver

    App\Service\GeoIp\MmdbGeoCodeLookupInterface:
        alias: App\Service\GeoIp\MaxMindMmdbGeoCodeLookup

    App\Service\DataTransfer\DataTransfer:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\GeoIp\MaxMindMmdbGeoCodeLookup:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Security\IpRateLimiter:
        arguments:
            $storageDir: '%kernel.project_dir%/var/rate_limit'
            $hashSecret: '%kernel.secret%'
            $maxPerMinute: 100
        calls:
            - setConfigLoader: ['@App\Service\AggregateConfigLoader']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
