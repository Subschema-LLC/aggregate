# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Approved goal-event taxonomy. Keys are the stable values stored in events.
# Shipped defaults: application updates replace this file. To customize the
# goals, use the Goals page (Data model > Goals) or app:config, which write
# config/goals.local.yaml, or copy this file there and edit the copy. Goals in
# the local file replace these as a whole. Changes apply without clearing the
# cache.
parameters:
    app.goal_events:
        purchase:
            label: 'Purchase'
            enabled: true
            anonymous: true

        lead:
            label: 'Lead'
            enabled: true
            anonymous: true

        signup:
            label: 'Signup'
            enabled: true
            anonymous: true

        subscription:
            label: 'Subscription'
            enabled: true
            anonymous: true

        booking:
            label: 'Booking'
            enabled: true
            anonymous: true

        contact:
            label: 'Contact request'
            enabled: true
            anonymous: true

        download:
            label: 'Download'
            enabled: true
            anonymous: true
