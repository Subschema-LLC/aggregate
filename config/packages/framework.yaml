# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(csv:TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    rate_limiter:
        # Requests per reporting API token (docs/REPORTING-API.md#rate-limits).
        reporting_api:
            policy: fixed_window
            limit: 120
            interval: '1 minute'
        # Requests per MCP credential: token or assistant connection (docs/MCP.md#limits).
        mcp:
            policy: fixed_window
            limit: 120
            interval: '1 minute'
        # Sign-in endpoint requests per client address: registration, tokens, revocation.
        mcp_sign_in:
            policy: fixed_window
            limit: 30
            interval: '1 minute'
        # Emailed sign-in codes (docs/EMAIL.md#sign-in-codes): codes sent per
        # account, requests per client address, and wrong codes per account
        # from any browser before code sign-in pauses for that account.
        sign_in_code_request:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        sign_in_code_request_address:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        sign_in_code_guess:
            policy: sliding_window
            limit: 10
            interval: '24 hours'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
