# Loaded by server role (src/Service/Cluster/ServerRole.php); see docs/CONFIGURATION.md.
# Roles that administer: all and administration. The home page, the reporting
# API and the MCP server with its OAuth endpoints; MCP's consent page needs a
# dashboard session, so it is in routes_dashboard.yaml.

home_controller:
    resource: ../src/Controller/HomeController.php
    type: attribute

reporting_api_controller:
    resource: ../src/Controller/ReportingApiController.php
    type: attribute

mcp_controller:
    resource: ../src/Controller/McpController.php
    type: attribute
