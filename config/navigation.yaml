# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Main navigation content. Each link defines exactly one Symfony route or URL.
# Clear the production cache after changing this file.
parameters:
    app.main_navigation:
        brand:
            label: 'Aggregate Analytics'
            route: 'app_home'

        items:
            - label: 'Documentation'
              route: 'app_how_it_works'
              icon: 'fas fa-circle-info'
            - label: 'Reporting'
              route: 'app_how_it_works_data_visualization'
              icon: 'fas fa-bar-chart'

        account:
            user_icon: 'fas fa-user'
            logout:
                label: 'Logout'
                url: '/logout'
                icon: 'fas fa-sign-out-alt'
