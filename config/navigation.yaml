# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Main navigation content. The brand entry controls its link destination and
# retains a legacy label fallback; identity and theme branding come from
# config/aggregate.yaml.
# Links define exactly one Symfony route, URL, or documentation topic (docs:),
# which opens on the documentation site. Top-level items may instead
# define a label and children (one submenu level, no parent route/URL).
# Links and groups may require a security role and a registered feature name.
# A link to a dashboard route that App\Security\Access\DashboardPages lists
# also appears only for users who can view that page; administrators can view
# every page, and standard users see what an administrator granted them.
# A link may also name a shown_when condition (App\Service\NavigationConditions):
# the menu leaves it out until the condition is met, and quick search still
# finds it. Hidden/inaccessible children are filtered before empty groups are
# removed; disabling a group makes every remaining child unclickable.
# Navigation does not grant access: destination routes enforce authorization.
# Clear the production cache after changing this file.
# Shipped defaults: application updates replace this file. To customize it,
# copy it to config/navigation.local.yaml and edit the copy. A parameter defined
# in the local file replaces the matching parameter here as a whole.
parameters:
    app.main_navigation:
        brand:
            # Backward-compatible fallback; runtime branding belongs in aggregate.yaml.
            label: 'Aggregate Analytics'
            route: 'app_home'

        items:
            - label: 'Setup'
              route: 'app_setup'
              icon: 'fas fa-list-check'
            - label: 'Websites'
              route: 'app_dashboard'
              icon: 'fas fa-globe'
            - label: 'Website groups'
              route: 'app_website_groups'
              icon: 'fas fa-layer-group'
            - label: 'Collection'
              icon: 'fas fa-code'
              children:
                  - label: 'Tag manager lite'
                    route: 'app_tag_manager'
                    icon: 'fas fa-tags'
                  - label: 'Consent manager lite'
                    route: 'app_consent_manager'
                    icon: 'fas fa-user-shield'
                  - label: 'Collection controls'
                    route: 'app_collection_settings'
                    icon: 'fas fa-sliders'
                  - label: 'Data model'
                    route: 'app_data_model'
                    icon: 'fas fa-table-columns'
                  - label: 'Organization traffic'
                    route: 'app_internal_traffic'
                    icon: 'fas fa-users'
            - label: 'Reporting'
              icon: 'fas fa-database'
              children:
                  - label: 'Reporting views'
                    route: 'app_data_model_reporting'
                    icon: 'fas fa-table'
                  - label: 'BI glossary'
                    route: 'app_bi_glossary'
                    icon: 'fas fa-language'
                  - label: 'BI disclosure'
                    route: 'app_privacy_settings'
                    icon: 'fas fa-shield-halved'
                  - label: 'Page groups'
                    route: 'app_bi_page_groups'
                    icon: 'fas fa-layer-group'
                  # BigQuery and the reporting database, as tabs of one page.
                  # Shown once either is on; until then, open it from quick
                  # search or the BI connection guide.
                  - label: 'Sync'
                    route: 'app_sync'
                    icon: 'fas fa-cloud-arrow-up'
                    shown_when: 'view_sync_on'
                  - label: 'BI connection guide'
                    route: 'app_how_it_works_data_visualization'
                    icon: 'fas fa-book-open'
            - label: 'Administration'
              icon: 'fas fa-gear'
              children:
                  - label: 'General settings'
                    route: 'app_application_settings'
                    icon: 'fas fa-sliders'
                  - label: 'Branding'
                    route: 'app_branding_settings'
                    icon: 'fas fa-palette'
                  - label: 'Users'
                    route: 'app_users'
                    icon: 'fas fa-user-gear'
                    role: 'ROLE_ADMIN'
                  - label: 'Data lifecycle'
                    route: 'app_data_lifecycle'
                    icon: 'fas fa-box-archive'
                  # Administrators only: it can import accounts and copies every website's events.
                  - label: 'Data transfer'
                    route: 'app_data_transfer'
                    icon: 'fas fa-right-left'
                    role: 'ROLE_ADMIN'
                  - label: 'Scheduled tasks'
                    route: 'app_scheduled_tasks'
                    icon: 'fas fa-clock'
                  - label: 'Audit trail'
                    route: 'app_audit_trail'
                    icon: 'fas fa-clipboard-list'
                  - label: 'Updates'
                    route: 'app_updates'
                    icon: 'fas fa-rotate'
                    feature: 'updates'
                  - label: 'Feature flags'
                    route: 'app_feature_flags'
                    icon: 'fas fa-toggle-on'
            - label: 'Help'
              icon: 'fas fa-circle-question'
              children:
                  - label: 'How it works'
                    route: 'app_how_it_works'
                    icon: 'fas fa-circle-info'
                  - label: 'Event examples'
                    route: 'app_event_examples'
                    icon: 'fas fa-file-code'
                  # A documentation topic (App\Service\DocumentationLinks::TOPICS) on
                  # the site set by documentation_url; hidden when that is empty.
                  - label: 'Documentation'
                    docs: 'home'
                    icon: 'fas fa-book'

        account:
            user_icon: 'fas fa-user'
            logout:
                label: 'Logout'
                url: '/logout'
                icon: 'fas fa-sign-out-alt'
